[project]
name = "webtome"
version = "0.1.0"
description = "Turn web feeds and articles into print-ready books, volume after volume."
readme = "README.md"
license = "MIT"
authors = [{ name = "Saverio Mazza" }]
requires-python = ">=3.11"
keywords = ["rss", "feed", "book", "print", "typst", "read-later", "pod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "typst>=0.13",
    "python-slugify>=8.0",
]

[project.urls]
Repository = "https://github.com/mazzasaverio/webtome"
Issues = "https://github.com/mazzasaverio/webtome/issues"

[project.scripts]
webtome = "webtome.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webtome"]
